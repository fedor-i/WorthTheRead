[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "worth-your-read"
version = "0.1.0"
description = "MCP tool that verifies scientific claims against a paper's actual results"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "anthropic>=0.40.0",
    "requests>=2.28.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1"]

[project.scripts]
worth-your-read = "worth_your_read.server:main"

# The repo root IS the package body (files live at the top level), so map the
# package name onto "." rather than restructuring the repo.
[tool.setuptools]
packages = ["worth_your_read"]

[tool.setuptools.package-dir]
worth_your_read = "."
